<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Ghost renders the Flux theme, and the theme can call Supabase Edge Functions that ask an AI model for questions and topics about a post">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#3b3550"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#f4f1ec"/>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#2a2540" text-anchor="middle">
    <rect x="40" y="150" width="300" height="180" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="190" y="222">Ghost</text>
    <text x="190" y="262" font-size="24" font-weight="400">hosted on Magic Pages</text>
    <text x="190" y="296" font-size="24" font-weight="400">posts, members, routes</text>
    <rect x="450" y="150" width="300" height="180" rx="14" fill="#e4dff0" stroke="#3b3550" stroke-width="4"/>
    <text x="600" y="222">Flux theme</text>
    <text x="600" y="262" font-size="24" font-weight="400">Handlebars, Tailwind v4</text>
    <text x="600" y="296" font-size="24" font-weight="400">two newsletter streams</text>
    <rect x="860" y="150" width="300" height="180" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="1010" y="222">AI analysis</text>
    <text x="1010" y="262" font-size="24" font-weight="400">Supabase Edge Functions</text>
    <text x="1010" y="296" font-size="24" font-weight="400">optional, member tiers</text>
  </g>
  <path d="M344 240 H442" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M754 240 H852" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
</svg>
