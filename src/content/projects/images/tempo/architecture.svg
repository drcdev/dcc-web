<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="The Tempo app keeps routines in a Drift database on the device, with optional sync to Supabase and optional workouts written to Apple Health or Health Connect">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#3b3550"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#f4f1ec"/>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#2a2540" text-anchor="middle">
    <rect x="40" y="150" width="300" height="180" rx="14" fill="#e4dff0" stroke="#3b3550" stroke-width="4"/>
    <text x="190" y="222">Tempo app</text>
    <text x="190" y="262" font-size="24" font-weight="400">Flutter, Riverpod</text>
    <text x="190" y="296" font-size="24" font-weight="400">iOS, Android, Web</text>
    <rect x="450" y="150" width="300" height="180" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="600" y="222">On-device data</text>
    <text x="600" y="262" font-size="24" font-weight="400">Drift SQLite, reactive</text>
    <text x="600" y="296" font-size="24" font-weight="400">works offline</text>
    <rect x="860" y="40" width="300" height="160" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="1010" y="108">Supabase</text>
    <text x="1010" y="148" font-size="24" font-weight="400">optional cloud sync</text>
    <rect x="860" y="280" width="300" height="160" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="1010" y="348">Apple Health</text>
    <text x="1010" y="388" font-size="24" font-weight="400">or Health Connect, optional</text>
  </g>
  <path d="M344 240 H442" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M754 220 L852 130" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M754 260 L852 350" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
</svg>
