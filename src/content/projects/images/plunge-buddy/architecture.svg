<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="The Plunge Buddy app takes the phone's location, and its network services fetch weather, marine and tide data from three public APIs">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#3b3550"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#f4f1ec"/>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#2a2540" text-anchor="middle">
    <rect x="40" y="150" width="300" height="180" rx="14" fill="#e4dff0" stroke="#3b3550" stroke-width="4"/>
    <text x="190" y="222">Plunge Buddy</text>
    <text x="190" y="262" font-size="24" font-weight="400">SwiftUI, MVVM</text>
    <text x="190" y="296" font-size="24" font-weight="400">location from CoreLocation</text>
    <rect x="450" y="150" width="300" height="180" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="600" y="222">Network services</text>
    <text x="600" y="262" font-size="24" font-weight="400">Swift actors, async/await</text>
    <text x="600" y="296" font-size="24" font-weight="400">one per data source</text>
    <rect x="860" y="40" width="300" height="110" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="1010" y="88">OpenWeatherMap</text>
    <text x="1010" y="124" font-size="24" font-weight="400">air temperature</text>
    <rect x="860" y="185" width="300" height="110" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="1010" y="233">Open-Meteo</text>
    <text x="1010" y="269" font-size="24" font-weight="400">water and waves</text>
    <rect x="860" y="330" width="300" height="110" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="1010" y="378">WorldTides</text>
    <text x="1010" y="414" font-size="24" font-weight="400">high and low tides</text>
  </g>
  <path d="M344 240 H442" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M754 215 L852 100" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M754 240 H852" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M754 265 L852 380" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
</svg>
