<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Claude Desktop calls the Focus Pocus MCP server, which runs JXA scripts in OmniFocus">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#3b3550"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#f4f1ec"/>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#2a2540" text-anchor="middle">
    <rect x="40" y="150" width="300" height="180" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="190" y="230">Claude Desktop</text>
    <text x="190" y="272" font-size="24" font-weight="400">asks in plain words</text>
    <rect x="450" y="150" width="300" height="180" rx="14" fill="#e4dff0" stroke="#3b3550" stroke-width="4"/>
    <text x="600" y="230">Focus Pocus</text>
    <text x="600" y="272" font-size="24" font-weight="400">MCP server, 35+ tools</text>
    <rect x="860" y="150" width="300" height="180" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="1010" y="230">OmniFocus</text>
    <text x="1010" y="272" font-size="24" font-weight="400">39 JXA scripts</text>
  </g>
  <path d="M344 240 H442" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M754 240 H852" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
</svg>
