<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="A change goes through one of four pipelines, then a pull request, Don's one approving review and main, with the constitution over every step" font-family="Inter, sans-serif">
  <!-- Inter 4.1, Copyright 2016 The Inter Project Authors (https://github.com/rsms/inter). Glyph subset licensed under the SIL Open Font License 1.1: https://openfontlicense.org (full text in src/assets/fonts/LICENSE.txt). Written by scripts/fonts/embed-diagram-fonts.ts: edit a label, then re-run it. -->
  <style data-inter-subset="">@font-face{font-family:Inter;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:Inter;font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}</style>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 z" fill="#3b3550"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#f4f1ec"/>
  <rect x="20" y="24" width="1160" height="64" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="600" y="66" font-size="28" font-weight="700" fill="#2a2540" text-anchor="middle">Constitution: governs every step</text>
  <g font-size="24" font-weight="700" fill="#2a2540" text-anchor="middle">
    <rect x="20" y="120" width="200" height="300" rx="14" fill="#e4dff0" stroke="#3b3550" stroke-width="4"/>
    <text x="120" y="172">Pipeline</text>
    <text x="120" y="216" font-size="24" font-weight="400">deliver</text>
    <text x="120" y="250" font-size="24" font-weight="400">tweak</text>
    <text x="120" y="284" font-size="24" font-weight="400">squash</text>
    <text x="120" y="318" font-size="24" font-weight="400">chore</text>
    <rect x="260" y="120" width="200" height="300" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="360" y="172">Phases</text>
    <text x="360" y="216" font-size="24" font-weight="400">each in a</text>
    <text x="360" y="250" font-size="24" font-weight="400">fresh</text>
    <text x="360" y="284" font-size="24" font-weight="400">subagent,</text>
    <text x="360" y="318" font-size="24" font-weight="400">ends in</text>
    <text x="360" y="352" font-size="24" font-weight="400">verify</text>
    <rect x="500" y="120" width="200" height="300" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="600" y="172">Pull request</text>
    <text x="600" y="216" font-size="24" font-weight="400">by an agent</text>
    <text x="600" y="250" font-size="24" font-weight="400">from a</text>
    <text x="600" y="284" font-size="24" font-weight="400">separate</text>
    <text x="600" y="318" font-size="24" font-weight="400">account</text>
    <rect x="740" y="120" width="200" height="300" rx="14" fill="#e4dff0" stroke="#3b3550" stroke-width="4"/>
    <text x="840" y="172">Review</text>
    <text x="840" y="216" font-size="24" font-weight="400">Don's one</text>
    <text x="840" y="250" font-size="24" font-weight="400">approving</text>
    <text x="840" y="284" font-size="24" font-weight="400">review</text>
    <rect x="980" y="120" width="200" height="300" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
    <text x="1080" y="172">main</text>
    <text x="1080" y="216" font-size="24" font-weight="400">then</text>
    <text x="1080" y="250" font-size="24" font-weight="400">production</text>
  </g>
  <path d="M224 270 H256" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M464 270 H496" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M704 270 H736" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M944 270 H976" stroke="#3b3550" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
</svg>
