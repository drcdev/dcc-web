    <text x="190" y="262" font-size="24" font-weight="400">Expo, React Native</text>
    <text x="190" y="296" font-size="24" font-weight="400">iOS, Android, Web</text>
    <rect x="450" y="150" width="300" height="214" rx="14" fill="#ffffff" stroke="#3b3550" stroke-width="4"/>
