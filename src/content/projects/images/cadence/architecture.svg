<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="The Cadence app keeps routines and history in on-device storage with a write queue, syncing to Supabase when online, and starts Apple Watch workouts through a Shortcuts handoff" font-family="Inter, sans-serif">
