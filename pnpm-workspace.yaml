packages:
  - worker
# pnpm 11's built-in minimumReleaseAge (1 day) applies. Add a minimumReleaseAgeExclude entry
# only for one specific upgrade, and remove it in the PR after that upgrade.
allowBuilds:
  esbuild: true
  workerd: true
# Keep the stable @emnapi line. Auto-installed peers of @napi-rs/wasm-runtime resolve to the
# 2.0.0-beta releases otherwise, and the beta runtime crashes `astro check` on exit.
overrides:
  '@emnapi/core': 1.11.3
  '@emnapi/runtime': 1.11.3
