name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Decide which checks this change can affect
        id: changes
        run: node scripts/ci/changed-paths.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for committed secrets
        if: steps.changes.outputs.full == 'false'
        run: pnpm run lint:secrets

      - name: Install Playwright's Chromium browser
        if: steps.changes.outputs.full != 'false'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the verify gate
        if: steps.changes.outputs.full != 'false'
        run: pnpm run verify

      - name: Check the preview's sitemap and links
        if: github.event_name == 'pull_request' && steps.changes.outputs.full != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/site-check/preview.ts

      - name: Upload Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-output
          path: |
            playwright-report/
            test-results/
            tests/e2e/**/*-snapshots/**
          if-no-files-found: ignore
