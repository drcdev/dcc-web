name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.changes.outputs.tier }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Decide which checks this change can affect
        id: changes
        run: node scripts/ci/changed-paths.ts

  static:
    name: static
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for committed secrets
        run: pnpm run lint:secrets

      - name: Lint
        if: needs.changes.outputs.tier != 'skip-safe' && needs.changes.outputs.tier != 'docs'
        run: pnpm run lint

      - name: Type-check
        if: needs.changes.outputs.tier != 'skip-safe' && needs.changes.outputs.tier != 'docs'
        run: pnpm run typecheck

      - name: Run the unit and component tests
        if: needs.changes.outputs.tier != 'skip-safe'
        run: pnpm run test:unit

      - name: Run the worker tests
        if: needs.changes.outputs.tier != 'skip-safe' && needs.changes.outputs.tier != 'docs'
        run: pnpm run test:worker

  build-tests:
    name: build-tests
    needs: changes
    if: needs.changes.outputs.tier != 'skip-safe' && needs.changes.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the build tests
        if: needs.changes.outputs.tier != 'content-only'
        run: pnpm run test:build

      - name: Run the build tests that read the real content
        if: needs.changes.outputs.tier == 'content-only'
        run: pnpm run test:build:content

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.tier != 'skip-safe' && needs.changes.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the site
        run: pnpm run build

      - name: Run the end-to-end, accessibility, visual and sections projects
        run: pnpm run test:e2e:parallel

      - name: Run the performance budget project
        run: pnpm run test:budget

      - name: Check the preview's sitemap and links
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/site-check/preview.ts

      - name: Upload Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-output
          path: |
            playwright-report/
            test-results/
            tests/e2e/**/*-snapshots/**
          if-no-files-found: ignore

  verify:
    name: verify
    needs: [changes, static, build-tests, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check that every needed job passed or was an expected skip
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/verify-needs.ts
